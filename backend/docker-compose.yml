services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: nightbag
      POSTGRES_PASSWORD: nightbag
      POSTGRES_DB: nightbag
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nightbag -d nightbag"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    image: migrate/migrate:v4.17.1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations
    command:
      [
        "-path=/migrations",
        "-database=postgres://nightbag:nightbag@db:5432/nightbag?sslmode=disable",
        "up",
      ]

  api:
    build: .
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://nightbag:nightbag@db:5432/nightbag?sslmode=disable
      PORT: "8080"
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:8081}"
      AUTH_SECRET: "${AUTH_SECRET:-dev-secret-degistir}"
      SEED_PASSWORD: "${SEED_PASSWORD:-nightbag123}"
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  seed:
    image: postgres:16-alpine
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: nightbag
    volumes:
      - ./db/seed:/seed:ro
    command:
      [
        "psql",
        "-h", "db",
        "-U", "nightbag",
        "-d", "nightbag",
        "-v", "ON_ERROR_STOP=1",
        "-f", "/seed/dev_seed.sql",
        "-f", "/seed/dev_test_data.sql"
      ]

  frontend:
    image: nightbag-frontend-dev
    build:
      context: ../frontend
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8081:8081"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      EXPO_NO_TELEMETRY: "1"

volumes:
  pgdata:
  frontend_node_modules:
