name: CI & Demo Build

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # GitHub arayüzünden manuel tetiklemek için

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Bağımlılıkları Yükle
        run: npm ci

      - name: TypeScript Tip Kontrolü
        run: npx tsc --noEmit

      - name: Expo Linter
        run: npx expo lint --max-warnings 0
        continue-on-error: true

  build-web-demo:
    name: Build Web Demo
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Bağımlılıkları Yükle
        run: npm ci

      - name: Expo Web Çıktısı Al (Export)
        run: npx expo export --platform web

      - name: Çıktıyı Artifact Olarak Yükle
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 7
